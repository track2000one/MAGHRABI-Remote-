name: Build MAGHRABI Remote Agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "server.mjs"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-agent:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install

      - name: Validate React production build
        run: npm run build

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore agent/MaghrabiRemoteAgent.csproj

      - name: Publish Windows x64 single EXE
        run: >-
          dotnet publish agent/MaghrabiRemoteAgent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o agent/publish

      - name: Prepare package
        shell: pwsh
        run: |
          Copy-Item agent/agent.config.example.json agent/publish/agent.config.example.json
          @"
          @echo off
          chcp 65001 >nul
          title MAGHRABI Remote Agent V2.2
          cd /d "%~dp0"
          MAGHRABI-Remote-Agent.exe
          echo.
          echo Agent exited with code %ERRORLEVEL%
          echo.
          pause
          "@ | Set-Content -Encoding ASCII agent/publish/RUN-AGENT.bat

          @"
          MAGHRABI Remote Agent V2.2
          ===========================

          Recommended start method:
          Double-click RUN-AGENT.bat during testing.

          Keep your existing agent.config.json from the working V2.1.1 build.
          Missing V2.2 options default to enabled automatically.

          Required configuration:
          - serverUrl: https://maghrabi-remote-production.up.railway.app
          - token: same MAGHRABI_AGENT_TOKEN value configured in Railway
          - displayName: HOME-PC
          - screenCaptureEnabled: true
          - remoteControlEnabled: true

          V2.2 capabilities:
          - Device heartbeat / Online status
          - Authenticated primary-screen viewing
          - Mouse movement, left/right/middle click, and wheel
          - Standard keyboard input including modifiers, arrows, function keys and Windows key
          - Input is accepted only while the owner has an active authenticated remote session
          - Held keys/buttons are released automatically when the session ends

          Current limitations:
          - Ctrl+Alt+Del secure attention sequence is not supported
          - Windows UAC secure desktop is not controlled
          - Primary monitor only
          - Image transport is still JPEG polling; WebRTC comes in a later version

          Diagnostics:
          - Detailed errors are written to agent.log beside the EXE.
          "@ | Set-Content -Encoding UTF8 agent/publish/README-AGENT.txt

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAGHRABI-Remote-Agent-Windows-x64
          path: agent/publish/
          if-no-files-found: error
          retention-days: 30
