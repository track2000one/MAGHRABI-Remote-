name: Build MAGHRABI Remote Agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-agent:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore agent/MaghrabiRemoteAgent.csproj

      - name: Publish Windows x64 single EXE
        run: >-
          dotnet publish agent/MaghrabiRemoteAgent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o agent/publish

      - name: Prepare package
        shell: pwsh
        run: |
          Copy-Item agent/agent.config.example.json agent/publish/agent.config.example.json
          @"
          @echo off
          chcp 65001 >nul
          title MAGHRABI Remote Agent V2.1.1
          cd /d "%~dp0"
          MAGHRABI-Remote-Agent.exe
          echo.
          echo Agent exited with code %ERRORLEVEL%
          echo.
          pause
          "@ | Set-Content -Encoding ASCII agent/publish/RUN-AGENT.bat

          @"
          MAGHRABI Remote Agent V2.1.1
          =============================

          Recommended start method:
          Double-click RUN-AGENT.bat instead of the EXE during testing.

          If agent.config.json is missing, the Agent now creates one automatically
          and stays open so you can edit it.

          Required configuration:
          - serverUrl: https://maghrabi-remote-production.up.railway.app
          - token: same MAGHRABI_AGENT_TOKEN value configured in Railway
          - displayName: HOME-PC
          - screenCaptureEnabled: true

          Diagnostics:
          - The window no longer closes immediately on configuration/runtime errors.
          - Detailed errors are written to agent.log beside the EXE.

          V2.1.1 capabilities:
          - Device heartbeat / Online status
          - Authenticated view-only primary-screen capture
          - Screen capture only during an authenticated owner view session
          - No mouse or keyboard control yet
          "@ | Set-Content -Encoding UTF8 agent/publish/README-AGENT.txt

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAGHRABI-Remote-Agent-Windows-x64
          path: agent/publish/
          if-no-files-found: error
          retention-days: 30
